receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  
  # AJUSTE: Mudou de otlp/tempo para otlp_grpc/tempo
  otlp_grpc/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # AJUSTE: Mudou de otlphttp/loki para otlp_http/loki
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

processors:
  batch:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo] # Atualizado aqui
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki] # Atualizado aqui